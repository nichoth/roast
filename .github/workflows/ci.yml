name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest]
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install npm dependencies
        # .npmrc sets package-lock=false, so no lockfile is committed. Write
        # one from package.json so npm ci can install from it.
        run: |
          npm install --package-lock-only --package-lock=true --no-audit --no-fund
          npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # Builds dist/cli.js, then runs the test bundle.
        run: npm test

      - name: Check the generated schema is committed
        run: git diff --exit-code -- roast.schema.json

      - name: Check package contents
        # Packs in dry-run mode; nothing is published.
        run: npm pack --dry-run

  security:
    name: Security
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check the hook script
        run: shellcheck src/gate/pre-commit.sh

      - name: Install npm dependencies
        # .npmrc sets package-lock=false, so no lockfile is committed. Write
        # one from package.json so npm ci can install from it.
        run: |
          npm install --package-lock-only --package-lock=true --no-audit --no-fund
          npm ci --no-audit --no-fund

      - name: Audit npm dependencies
        # Without --omit=dev: the bundled runtime libraries are
        # devDependencies.
        run: npm audit --audit-level=high
